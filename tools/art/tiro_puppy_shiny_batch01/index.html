<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiro bebê — três animações Brilhantes</title><style>body{margin:0;background:#f4ead7;font:16px system-ui;color:#4b321f}nav{display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}button{font:inherit;min-height:44px;border:2px solid #9c723e;border-radius:12px;padding:8px 18px;background:#fff4d7;color:inherit}button[aria-pressed=true]{background:#deb879}iframe{border:0;width:100%;height:calc(100dvh - 76px)}</style>
<nav aria-label="Animação"><button data-clip="head_tilt" aria-pressed="true">Inclinar a cabeça</button><button data-clip="scratch" aria-pressed="false">Coçar</button><button data-clip="yawn" aria-pressed="false">Bocejar</button></nav>
<iframe title="Comparação animada" src="head_tilt/preview.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('iframe').src=b.dataset.clip+'/preview.html'})</script></html>
