# Build Web do Godot (versão publicada + versão dev em /dev/) e publicação no GitHub Pages
# a cada push na main.
# Pré-requisito no GitHub: Settings > Pages > Source = "GitHub Actions".
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Baixar Godot e export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          cd ~/godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          rm -f *.zip *.tpz

      - name: Instalar export templates
        run: |
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL"
          cp ~/godot/templates/* "$TPL/"

      # Duas builds do mesmo commit (ver docs/DEPLOY.md, "Versão dev"):
      #   prod -> build/web      (https://vitorawi.github.io/tiro-adventure/)
      #   dev  -> build/web/dev  (https://vitorawi.github.io/tiro-adventure/dev/)
      # O canal vai em data/version.json; a dev usa outro save e mostra as ferramentas DEV.
      - name: Exportar Web (prod e dev)
        run: |
          ~/godot/godot --headless --path game --import
          export_channel() {
            local channel="$1" out="$2"
            echo "{ \"version\": \"$(git rev-parse --short HEAD)\", \"date\": \"$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')\", \"channel\": \"$channel\" }" > game/data/version.json
            cat game/data/version.json
            mkdir -p "$out"
            ~/godot/godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/$out/index.html"
            test -f "$out/index.html"
            # O SW do Godot instala a versão nova com cache.addAll(), que pode pegar arquivos
            # antigos do cache HTTP (o Pages manda guardar por 10 min). Força baixar do servidor.
            local sw="$out/index.service.worker.js"
            sed -i "s/cache.addAll(CACHED_FILES)/cache.addAll(CACHED_FILES.map((f) => new Request(f, { cache: 'reload' })))/" "$sw"
            grep -q "cache: 'reload'" "$sw"
          }
          export_channel prod build/web
          export_channel dev build/web/dev
          touch build/web/.nojekyll

      - name: Separar a versão dev da publicada
        # Mesmo site = caches do service worker com o mesmo prefixo: ao ativar, um apagaria
        # o cache do outro. Prefixo próprio (igual a PwaUpdater.CACHE_PREFIXES.dev) e nome
        # "Tiro DEV" no ícone da tela inicial.
        run: |
          DEV=build/web/dev
          sed -i "s/const CACHE_PREFIX = 'Tiro Adventure-sw-cache-'/const CACHE_PREFIX = 'Tiro Adventure DEV-sw-cache-'/" "$DEV/index.service.worker.js"
          grep -q "Tiro Adventure DEV-sw-cache-" "$DEV/index.service.worker.js"
          sed -i 's/"name":"Tiro Adventure"/"name":"Tiro DEV"/' "$DEV/index.manifest.json"
          sed -i 's#<title>Tiro Adventure</title>#<title>Tiro DEV</title>#' "$DEV/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
