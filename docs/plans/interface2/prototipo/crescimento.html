<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="proto.css">
<style>
.back {position:absolute;inset:0;background:url('../../../../build/screenshots/aj_base/b02_pet.png') center/360px 780px}
.veil {position:absolute;inset:0;background:var(--paper);opacity:.65}
.sheet {position:absolute;bottom:0;width:360px;padding:12px 16px 24px;background:var(--paper);border-radius:28px 28px 0 0;box-shadow:var(--shadow)}
.handle {width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.header {gap:8px;margin-bottom:12px}.header .t-title{flex:1}.hero{justify-content:center;gap:16px}.phase{width:120px;text-align:center}.disc{width:96px;height:96px;background:var(--sunken);border-radius:50%;display:grid;place-items:center;margin:0 auto 4px}.disc img{width:96px;height:96px}.future img{filter:brightness(0) saturate(100%);opacity:.78}.future{color:var(--ink2)}
.summary{justify-content:center;gap:8px;margin:12px 0}.steps{display:flex;gap:4px}.steps b{width:12px;height:6px;border-radius:3px;background:var(--sunken)}.steps b:first-child{background:var(--honey)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{height:108px;border-radius:16px;background:var(--sunken);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}.tile.on{background:var(--card);outline:2px solid var(--ink);outline-offset:-2px}.tile img{width:40px;height:40px}.dots{display:flex;gap:4px;height:10px}.dots b{width:10px;height:10px;border:2px solid var(--ink);border-radius:50%}.tile .num{font-size:18px;line-height:22px}.check{display:none;position:absolute;right:6px;top:6px;background:var(--go);color:white;border-radius:50%;padding:3px}
.detail{padding:12px;margin-top:12px}.detail .row{gap:8px}.route{margin:4px 0;color:var(--ink2);font-size:12px}.route img{width:24px;height:24px}.detail .btn{display:flex;margin-top:8px}.rewards{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}.ready-action{display:none;margin-top:12px}.ready .detail{display:none}.ready .tile{background:var(--go-soft)}.ready .check{display:block}.ready .ready-action{display:flex}.ready .steps b{background:var(--go)}.ready .dots b{background:var(--honey)}
</style></head><body><div class="screen"><div class="back"></div><div class="veil"></div>
<div class="sheet"><div class="handle"></div><div class="header row"><div class="t-title">Crescimento</div><div class="icon-btn sm"><span class="t-strong">ⓘ</span></div><div class="icon-btn sm"><i data-ic="list"></i></div><div class="icon-btn sm"><i data-ic="x"></i></div></div>
<div class="hero row"><div class="phase"><div class="disc"><img class="px" src="../../../../game/assets/sprites/ui/icons/hud_tiro_puppy.png"></div><div class="t-strong">Filhotinho</div></div><i data-ic="arrow"></i><div class="phase future"><div class="disc"><img class="px" src="../../../../game/assets/sprites/ui/icons/hud_tiro_young.png"></div><div class="t-strong">Dentinhos</div></div></div>
<div class="summary row"><div class="steps"><b></b><b></b><b></b></div><span class="num t-strong" id="count">0/4</span></div>
<div class="grid" id="grid"></div>
<div class="detail card"><div class="row"><div class="t-strong grow">Carinho</div><div class="icon-btn sm"><i data-ic="help"></i></div></div><div class="route row"><img class="px" src="../../../../game/assets/sprites/ui/icons/tab_pet.png">Tiro<i data-ic="chev" data-size="16"></i><img class="px" src="../../../../game/assets/sprites/ui/icons/action_pet.png">Carinho</div><div class="t-cap">Quando ele pedir</div><div class="btn go">Fazer carinho</div></div>
<div class="btn go ready-action">Crescer!</div><div class="rewards"><span class="t-cap">AO CRESCER</span><span class="chip prize"><img class="px" src="../../../../game/assets/sprites/ui/icons/rare_star.png"><span class="num">Truques: Dá a pata · Fala</span></span></div>
</div></div>
<script>
const ready=location.hash==='#pronto';if(ready)document.body.classList.add('ready');
const rows=[['action_pet','Carinho',0,3],['item_frozen_carrot','Refeições',0,3],['item_chew_ring','Argolinha',0,1]];
document.querySelector('#grid').innerHTML=rows.map(([icon,name,n,m],i)=>`<div class="tile ${i===0&&!ready?'on':''}"><div class="ringbox" data-ring="52,4,${ready?1:n/m},${ready?'#2b9946':'#ffb730'}"><img class="px" src="../../../../game/assets/sprites/ui/icons/${icon}.png"></div><div class="t-cap">${name}</div><span class="num">${ready?m:n}/${m}</span>${i===0?'<div class="dots"><b></b><b></b><b></b></div>':''}<span class="check"><i data-ic="check" data-size="14"></i></span></div>`).join('');
document.querySelector('#count').textContent=ready?'3/3':'0/3';
</script><script src="proto.js"></script></body></html>
