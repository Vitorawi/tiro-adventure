  .phone { width: 360px; }

  .tag.old { background: #D9CBB8; color: var(--ink2); } .tag.new { background: var(--go); color: #fff; }

    document.body.style.width = document.documentElement.style.width = '1180px';
    document.querySelector('.cols').style.gap = '16px';
    document.querySelectorAll('.phone').forEach(el => el.style.width = '212px');
