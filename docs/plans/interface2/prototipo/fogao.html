<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="proto.css">
<style>
  body { background: #ecd0ab; }
  #world { position: absolute; inset: 0; }
  .worldbar { position: absolute; top: 76px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 20; }
  .worldpill { height: 44px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; padding: 0 12px 0 6px; }
  .worldpill img { width: 32px; height: 32px; }
  .face { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .face img { width: 40px; height: 40px; margin: 2px; }
  .tray { position: absolute; left: 12px; right: 12px; top: 198px; border-radius: 24px; background: var(--card); box-shadow: 0 10px 30px rgba(80, 50, 20, .25); padding: 12px; z-index: 18; }
  .tray::before { content: ""; position: absolute; left: 208px; top: -9px; width: 20px; height: 20px; background: var(--card); transform: rotate(45deg); border-radius: 4px; }
  .slot { position: relative; width: 52px; height: 52px; }
  .slot img { width: 32px; height: 32px; position: relative; }
  .slot.empty { border-radius: 50%; border: 2px dashed var(--ink3); display: grid; place-items: center; color: var(--ink3); }
  .slot.locked { border-radius: 50%; background: var(--sunken); display: grid; place-items: center; color: var(--ink2); }
  .slot .cap { position: absolute; left: -10px; right: -10px; top: 54px; text-align: center; }
  .slot .ok { position: absolute; right: -4px; top: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--go); color: #fff; display: grid; place-items: center; border: 2px solid var(--card); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 28px; }
  .tile { position: relative; height: 68px; border-radius: 16px; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tile img { width: 36px; height: 36px; }
  .tile.sel { background: var(--card); box-shadow: 0 0 0 2.5px var(--ink), var(--shadow-sm); }
  .tile.miss img { opacity: .45; }
  .tile .need { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: #FDE6E3; display: grid; place-items: center; }
  .tile .need img { width: 16px; height: 16px; opacity: 1; }
  .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stepper { height: 44px; border-radius: 22px; background: var(--sunken); display: flex; align-items: center; gap: 2px; padding: 0 4px; }
  .stepper .b { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--ink); box-shadow: var(--shadow-sm); }
  .stepper .b.off { color: var(--ink3); box-shadow: none; background: transparent; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 70%); z-index: 1; }
  body.vazio .tray, body.vazio .hud, body.vazio .worldbar, body.vazio nav { display: none !important; }
</style></head>
<body><div class="screen">
  <canvas id="world" width="720" height="1560" style="width:360px;height:780px"></canvas>
  

  <div class="hud">
    <div class="avatar"><div class="abs" data-ring="58,5,0.62,#FFB730"></div>
      <img class="px" src="../../../../game/assets/sprites/ui/icons/hud_tiro.png" style="z-index:1"></div>
    <div class="grow"></div>
    <div class="pill"><img class="px" src="../../../../game/assets/sprites/ui/icons/coin.png" style="width:28px;height:28px"><span class="num" style="font-size:18px">2.645</span></div>
    <div class="icon-btn"><i data-ic="gear" data-size="22"></i></div>
  </div>
  <div class="worldbar" style="top:76px">
    <div class="worldpill"><img class="px" src="../../../../game/assets/sprites/ui/icons/tab_house.png"><span class="t-strong">Casa</span><span style="color:var(--ink2)"><i data-ic="down" data-size="18"></i></span></div>
    <div class="grow"></div>
    <div class="face"><img class="px" src="../../../../game/assets/sprites/characters/npc_lais/portrait.png"></div>
  </div>

  <!-- Bandeja do fogão: menor, presa ao fogão, o mundo continua visível -->
  <div class="tray">
    <div class="row" style="gap:8px">
      <img class="px" src="../../../../game/assets/sprites/ui/icons/station_stove.png" style="width:32px;height:32px">
      <span class="t-strong grow">Fogão</span>
      <span class="icon-btn sm"><i data-ic="list" data-size="18"></i></span>
      <span class="icon-btn sm"><i data-ic="x" data-size="18"></i></span>
    </div>
    <div class="row" style="gap:14px;margin-top:12px;padding-left:4px">
      <div class="slot ringbox" data-ring="52,4,0.7,#3E9FE4"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_carrot_snack.png"><span class="cap t-cap num" style="font-size:13px;color:#22679A">0:59</span></div>
      <div class="slot ringbox" data-ring="52,4,1,#2B9946,#D4EEDA"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_egg_scramble.png"><span class="ok"><i data-ic="check" data-size="15" data-stroke="3.2"></i></span><span class="cap t-cap" style="color:var(--go-ink)">Pronto</span></div>
      <div class="slot empty"><i data-ic="plus" data-size="18"></i></div>
      <div class="slot locked"><i data-ic="lock" data-size="18"></i><span class="cap t-cap row" style="justify-content:center;gap:2px"><img class="px" src="../../../../game/assets/sprites/ui/icons/coin.png" style="width:16px;height:16px">80</span></div>
    </div>
    <div class="grid">
      <div class="tile sel"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_carrot_snack.png"><span class="t-cap">1 min</span></div>
      <div class="tile"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_egg_scramble.png"><span class="t-cap">3 min</span></div>
      <div class="tile miss"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_pumpkin_mash.png"><span class="t-cap">5 min</span><span class="need"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_pumpkin.png"></span></div>
      <div class="tile"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_mashed_potato.png"><span class="t-cap">4 min</span></div>
      <div class="tile miss"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_milk_porridge.png"><span class="t-cap">6 min</span><span class="need"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_milk.png"></span></div>
      <div class="tile"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_puppy_mash.png"><span class="t-cap">2 min</span></div>
      <div class="tile"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_corn_crunch.png"><span class="t-cap">8 min</span></div>
      <div class="tile miss"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_cheese_bites.png"><span class="t-cap">10 min</span><span class="need"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_cheese.png"></span></div>
    </div>
    <div class="detail">
      <div class="row" style="gap:6px"><span class="t-strong grow">Petisco de cenoura</span><span class="chip time"><i data-ic="clock" data-size="16"></i><span class="num">1 min</span></span></div>
      <div class="row" style="gap:6px;margin-top:8px">
        <span class="chip ok"><img class="px" src="../../../../game/assets/sprites/ui/icons/item_carrot.png"><span class="num">2</span><i data-ic="check" data-size="14" data-stroke="3"></i></span>
        <span style="color:var(--ink3)"><i data-ic="arrow" data-size="16"></i></span>
        <span class="chip prize"><img class="px" src="../../../../game/assets/sprites/ui/icons/need_hunger.png"><span class="num">+20</span></span>
        <span class="chip prize"><img class="px" src="../../../../game/assets/sprites/ui/icons/need_happiness.png"><span class="num">+15</span></span>
      </div>
      <div class="row" style="gap:8px;margin-top:12px">
        <div class="stepper"><span class="b off"><i data-ic="minus" data-size="18"></i></span><span class="num" style="width:34px;text-align:center;font-size:18px">×1</span><span class="b"><i data-ic="plus" data-size="18"></i></span></div>
        <span class="btn go grow">Cozinhar</span>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-active="map" data-badges="tasks:2"></nav>
</div>
<script src="proto.js"></script>
<script>if (location.hash === '#vazio') document.body.classList.add('vazio');</script>
<script>
  // Casa montada a partir de data/rooms/house.json (fundo + móveis, ordenados pela base), câmera aproximada no fogão.
  const A = '../../../../game/assets/sprites/areas/house/';
  const S = 2, Z = 1.6, CAM = [300, 150], CENTER = [230, 150];
  const items = [
    ['room.png', null], ['island.png', [335, 286]], ['fridge.png', [250, 195]], ['stove_cooking/frame_00.png', [300, 169]],
    ['blender.png', [318, 186], 1, 9], ['chest.png', [118, 264], 2], ['named_bowl.png', [215, 238]], ['sofa.png', [470, 330]],
    ['bed_soft.png', [372, 336], 1.5], ['../../characters/tiro_world/rotations/south-east.png', [232, 262]],
  ];
  const ctx = document.getElementById('world').getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const g = ctx.createLinearGradient(0, 0, 0, 1560); g.addColorStop(0, '#f6e3cb'); g.addColorStop(1, '#ecd0ab');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 720, 1560);
  const toScreen = (x, y) => [((x - CAM[0]) * Z + CENTER[0]) * S, ((y - CAM[1]) * Z + CENTER[1]) * S];
  const imgs = items.map(([src]) => { const im = new Image(); im.src = A + src; return im; });
  let n = 0;
  imgs.forEach((im) => im.onload = () => {
    if (++n < imgs.length) return;
    const order = items.map((it, i) => i).sort((a, b) => {
      const ka = items[a][1] ? items[a][1][1] + (items[a][3] || 0) : -1, kb = items[b][1] ? items[b][1][1] + (items[b][3] || 0) : -1;
      return ka - kb;
    });
    for (const i of order) {
      const [src, pos, scale = 1] = items[i];
      const im = imgs[i];
      if (!pos) { const [x, y] = toScreen(0, 0); ctx.drawImage(im, x, y, im.width * Z * S, im.height * Z * S); continue; }
      const w = im.width * scale, h = im.height * scale;
      const [x, y] = toScreen(pos[0] - w / 2, pos[1] - h);
      ctx.drawImage(im, x, y, w * Z * S, h * Z * S);
    }
  });
</script>
</body></html>
